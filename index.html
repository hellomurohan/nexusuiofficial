<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Maintenance</title>
    <link rel="icon" type="image/png" href="under-maintenance-symbol-label-i.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <main class="maintenance-card" aria-labelledby="maintenance-title">
        <div class="status-badge">
            <span class="status-dot" aria-hidden="true"></span>
            Maintenance in progress
        </div>

        <img class="brand" src="background image.png" alt="NexusUI">

        <h1 id="maintenance-title">We’ll be back shortly</h1>
        <p class="description">
            We’re upgrading NexusUI to bring you a faster, smoother and more polished experience.
        </p>

        <div class="progress" role="progressbar" aria-label="Maintenance loading">
            <div class="progress-bar"></div>
        </div>
        <div class="loading-row">
            <span class="loading-text">Loading improvements</span>
            <span class="percentage">85%</span>
        </div>

        <p class="thanks">Thank you for your patience.</p>
    </main>

    <nav class="social" aria-label="Social media links">
        <a href="https://www.youtube.com/@nexusui.official" target="_blank" rel="noopener" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://www.linkedin.com/in/nexusuiofficial/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://www.facebook.com/nexusui.official" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/nexusui.official/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.threads.com/@nexusui.official" target="_blank" rel="noopener" aria-label="Threads"><i class="fab fa-threads"></i></a>
        <a href="https://x.com/nexusuiofficial" target="_blank" rel="noopener" aria-label="X"><i class="fab fa-x-twitter"></i></a>
        <a href="https://www.tiktok.com/@nexusui.official" target="_blank" rel="noopener" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://web.telegram.org/k/#@nexusuiofficial" target="_blank" rel="noopener" aria-label="Telegram"><i class="fab fa-telegram"></i></a>
    </nav>
</body>

</html>
